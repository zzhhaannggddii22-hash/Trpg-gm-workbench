name: One-time non-main branch cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-non-main-branches.yml

permissions:
  contents: write

jobs:
  delete-non-main-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Delete every remote branch except main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t branches < <(gh api --paginate "repos/${GH_REPO}/branches?per_page=100" --jq '.[].name')
          deleted=0
          failed=0
          for branch in "${branches[@]}"; do
            if [[ "${branch}" == "main" ]]; then
              continue
            fi
            echo "::group::Delete ${branch}"
            if gh api --method DELETE "repos/${GH_REPO}/git/refs/heads/${branch}"; then
              deleted=$((deleted + 1))
              echo "DELETED ${branch}"
            else
              failed=$((failed + 1))
              echo "FAILED ${branch}"
            fi
            echo "::endgroup::"
          done
          mapfile -t remaining < <(gh api --paginate "repos/${GH_REPO}/branches?per_page=100" --jq '.[].name')
          printf 'Deleted: %s\nFailed: %s\nRemaining branches: %s\n' "${deleted}" "${failed}" "${remaining[*]}"
          if [[ "${failed}" -ne 0 || "${#remaining[@]}" -ne 1 || "${remaining[0]}" != "main" ]]; then
            echo "Branch cleanup did not reach the required main-only state."
            exit 1
          fi
