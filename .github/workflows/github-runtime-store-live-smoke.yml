name: GitHub Runtime Store live smoke

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: read

jobs:
  live-smoke:
    if: >-
      github.event.issue.pull_request != null &&
      github.event.issue.number == 78 &&
      github.event.comment.body == '/run-github-runtime-store-live-smoke' &&
      github.event.comment.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted base workflow context
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check out the exact PR #78 head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          PR_HEAD_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"
          git fetch origin "${PR_HEAD_SHA}"
          git checkout --detach "${PR_HEAD_SHA}"
          echo "Testing PR head: ${PR_HEAD_SHA}"

      - name: Run live GraphQL persistence smoke test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python tests/github_graphql_runtime_store_live_smoke.py
