name: PR validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python test dependency
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install vendored Markdown parser
        run: npm ci --ignore-scripts --offline

      - name: Run repository regression suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -v

      - name: Run roll runtime adapter conformance harness
        run: python GM_Training/Testing/Fixtures/ROLL_RUNTIME_APPLICATION_ADAPTER_v1/roll_runtime_adapter.py

      - name: Check patch whitespace
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            git diff --check "origin/${{ github.event.pull_request.base.ref }}...${{ github.event.pull_request.head.sha }}"
          else
            git diff --check 6c6109202d92d7bbacd638d5aa37d00418262d2b..HEAD
          fi

  daggerheart-reference:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Daggerheart Core reference executor tests
        run: python Systems/Daggerheart/Testing/daggerheart_reference_engine.py
