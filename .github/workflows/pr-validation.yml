name: PR validation

on:
  push:
    branches:
      - fix/pr3-runtime-reliability
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python test dependency
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install vendored Markdown parser
        run: npm ci --ignore-scripts --offline

      - name: Run repository regression suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -v

      - name: Check patch whitespace
        run: git diff --check 6c6109202d92d7bbacd638d5aa37d00418262d2b..HEAD
